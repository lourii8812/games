<!DOCTYPE html>
<html>
  <head>
    <title>Games! by Lour</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id = "homepage" class="screen active">
      <h1> CHOOSE A GAME: </h1>
      <button onclick="openGTN()"> Guess the number </button>
      <button onclick="openRPS()"> Rock, Paper, Scissors </button>
      <button onclick="openPIG()"> Roll a Dice </button>
    </div>
    <div id="GTN" class="screen">
      <button onclick="GTNEasy()"> Easy mode (1-200) </button>
      <button onclick="GTNMedium()"> Medium Mode (1-500) </button>
      <button onclick="GTNHard()"> Hard Mode (1-1000) </button>
      <button class="hpbtn" onclick="GoBackHPage()" whenhovered="Yes"> Go back </button>
    </div>
     <div id="GTNEasy" class="screen">
        <input type="number" id="GTNEasyinput" min=1 max=200 placeholder="Enter number here">
        <p id="resulteasy"></p>
    </div>
    <div id="GTNMedium" class="screen">
      <input type="number" id="GTNMediuminput" min=1 max=500 placeholder="Enter number here">
      <p id="resultmedium"></p>
    </div>
    <div id="GTNHard" class="screen">
      <input type="number" id="GTNHardinput" min=1 max=1000 placeholder="Enter number here">
      <p id="resulthard"></p>
    </div>
    <div id="RPS" class="screen">
      <h2>You're playing with an AI! Choose wisely. </h2>
      <button onclick="play('rock')"> Rock </button>
      <button onclick="play('paper')"> Paper </button>
      <button onclick="play('scissors')"> Scissors </button>
      <p id="RPSResult"></p>
      <button class="hpbtn" onclick="GoBackHPage()" whenhovered="Yes"> Go Back? </button>
    </div>
    <div id="PIG" class="screen">
      <h2> JUST ROLL~ </h2>
      <p> Instructions: <br> If you roll a 1, your score gets recorded and you die. <br> If you roll anything other than 1, it will be added to your score!</p>
      <button onclick="roll()"> ROLL! </button>
      <p id="rolled"></p>
      <p id="totalscore"></p>
      <button class="hpbtn" onclick="GoBackHPage()" whenhovered="Yes"> Go Back? </button>
    </div>
  </body>
  <script src="script.js"></script>
</html>
